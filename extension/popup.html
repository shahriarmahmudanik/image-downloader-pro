<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Image Downloader Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header>
    <img class="logo" src="icons/icon48.png" alt="" width="32" height="32">
    <div class="title">
      <h1>Image Downloader <span>Pro</span></h1>
      <p id="count" aria-live="polite">Scanning…</p>
    </div>
  </header>

  <section class="filters" aria-label="Filters">
    <label class="size">Min size
      <select id="minSize">
        <option value="0">Any</option>
        <option value="100">100px+</option>
        <option value="300">300px+</option>
        <option value="600">600px+</option>
      </select>
    </label>
    <div class="chips">
      <label class="chip"><input type="checkbox" data-type="jpg" checked><span>JPG</span></label>
      <label class="chip"><input type="checkbox" data-type="png" checked><span>PNG</span></label>
      <label class="chip"><input type="checkbox" data-type="webp" checked><span>WebP</span></label>
      <label class="chip"><input type="checkbox" data-type="gif" checked><span>GIF</span></label>
      <label class="chip"><input type="checkbox" data-type="svg" checked><span>SVG</span></label>
      <label class="chip"><input type="checkbox" data-type="other" checked><span>Other</span></label>
    </div>
  </section>

  <section class="bar">
    <button id="all" type="button" class="ghost">Select all</button>
    <button id="none" type="button" class="ghost">None</button>
  </section>

  <div id="scan" class="scan" aria-hidden="true">
    <div class="scanline"></div>
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
  <main id="grid" hidden></main>
  <p id="empty" hidden>No images found on this page.</p>

  <footer>
    <button id="download" type="button" disabled>
      <span class="fill" id="fill"></span>
      <span class="label" id="dlLabel">Download (0)</span>
    </button>
    <a class="coffee" href="https://ko-fi.com/shahriaranik" target="_blank" rel="noopener noreferrer">
      <svg class="cup" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path class="steam s1" d="M8 7c-1-1.5 1-2 0-3.5"/>
        <path class="steam s2" d="M12 7c-1-1.5 1-2 0-3.5"/>
        <path class="steam s3" d="M16 7c-1-1.5 1-2 0-3.5"/>
        <path class="mug" d="M5 9h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5zM17 10h1.5a2.5 2.5 0 0 1 0 5H17"/>
      </svg>
      <span>Buy me a coffee</span>
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
